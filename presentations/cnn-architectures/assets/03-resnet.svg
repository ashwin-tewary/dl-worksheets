<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">A ResNet is a stack of residual blocks.</title><desc id="desc">ResNet-18: basic blocks, with a projection when spatial size or channels change.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#12655b"/></marker></defs>
<rect width="1000" height="430" fill="#fffefa"/>
<text x="36" y="43" font-family="Georgia,serif" font-size="28" fill="#183c35">A ResNet is a stack of residual blocks.</text>
<text x="36" y="76" font-family="system-ui,sans-serif" font-size="17" fill="#52655d">ResNet-18: basic blocks, with a projection when spatial size or channels change.</text>
<path d="M200 208H235" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M400 208H435" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 208H635" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
