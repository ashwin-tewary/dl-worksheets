<rect x="30" y="160" width="170" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="115.0" y="201.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Stem</text>
<text x="115.0" y="226.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">56 × 56 × 64</text>
<rect x="235" y="160" width="165" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="317.5" y="201.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Stage 1 · ×2</text>
<text x="317.5" y="226.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">56 × 56 × 64</text>
<rect x="435" y="160" width="165" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="517.5" y="201.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Stage 2 · ×2</text>
<text x="517.5" y="226.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">28 × 28 × 128</text>
<rect x="635" y="160" width="165" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="717.5" y="201.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Stage 3 · ×2</text>
<text x="717.5" y="226.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">14 × 14 × 256</text>
<rect x="835" y="160" width="140" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="905.0" y="201.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Stage 4 · ×2</text>
<text x="905.0" y="226.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">7 × 7 × 512</text>
<text x="35" y="318" font-family="system-ui,sans-serif" font-size="18" fill="#183c35">224 × 224 RGB input → stem → 8 basic blocks → global average pool → classifier</text>
<text x="35" y="355" font-family="system-ui,sans-serif" font-size="18" fill="#183c35">Main-path weighted layers: 1 stem + 8 × 2 convolutions + 1 classifier = 18</text>
