<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">One input. Several spatial scales.</title><desc id="desc">Inception-style module: branches run in parallel; concatenate their channels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#12655b"/></marker></defs>
<rect width="1000" height="430" fill="#fffefa"/>
<text x="36" y="43" font-family="Georgia,serif" font-size="28" fill="#183c35">One input. Several spatial scales.</text>
<text x="36" y="76" font-family="system-ui,sans-serif" font-size="17" fill="#52655d">Inception-style module: branches run in parallel; concatenate their channels.</text>
<path d="M155 229H190V134H230" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M190 198H230" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M190 229V262H230" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M190 262V326H230" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 134H705V229H760" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 198H705" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 262H705V229" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 326H705V262" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="25" y="197" width="130" height="65" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="90.0" y="223.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">28 × 28</text>
<text x="90.0" y="248.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">× 192</text>
<rect x="230" y="110" width="400" height="48" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="430.0" y="140.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">1 × 1 → 64 channels</text>
<rect x="230" y="174" width="400" height="48" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="430.0" y="204.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">1 × 1 → 96; 3 × 3 → 128</text>
<rect x="230" y="238" width="400" height="48" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="430.0" y="268.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">1 × 1 → 16; 5 × 5 → 32</text>
<rect x="230" y="302" width="400" height="48" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="430.0" y="332.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">3 × 3 max pool; 1 × 1 → 32</text>
<rect x="760" y="183" width="210" height="95" rx="9" fill="#e9f1e8" stroke="#aec6b9"/>
<text x="865.0" y="224.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">Concatenate</text>
<text x="865.0" y="249.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#183c35">28 × 28 × 256</text>
<text x="40" y="401" font-family="system-ui,sans-serif" font-size="18" fill="#183c35">Stride 1 + same padding preserves H and W. Output channels: 64 + 128 + 32 + 32.</text>
</svg>