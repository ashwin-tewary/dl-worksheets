<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Two routes to wider context</title><desc id="desc">Left: nested 3 by 3, 5 by 5 and 7 by 7 receptive fields for one output after one, two and three 3 by 3 convolutions, stride one and dilation one. Right: a 3 by 3 patch grid sends information to a query via global self-attention. CNNs can learn global context. Theoretical reach differs from effective influence; ViTs are not always superior.</desc>
