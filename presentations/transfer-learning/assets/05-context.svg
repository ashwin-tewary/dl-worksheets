<text x="40" y="78" font-size="32" fill="#183c35" font-weight="700" text-anchor="start">Two routes to wider context</text>
<text x="40" y="112" font-size="20" fill="#183c35" font-weight="400" text-anchor="start">Convolution expands spatial reach with depth; global attention directly mixes distant patches.</text>
