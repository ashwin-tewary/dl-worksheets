<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">From feature maps to two class scores</title><desc id="desc">Two channels are [[1,3],[2,2]] and [[0,2],[4,2]]. Their means are exactly 2 and 2. A schematic classifier with W=[[1,-0.5],[-0.5,1]] and b=[1,1] produces logits [2,2], not probabilities.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#12655b"/></marker><marker id="ochre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bc783d"/></marker></defs>
<rect width="1100" height="560" fill="#f7f5ef"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="34" font-size="18" fill="#12655b" font-weight="700" text-anchor="start">TRANSFER LEARNING  /  02</text>
<text x="40" y="78" font-size="32" fill="#183c35" font-weight="700" text-anchor="start">From feature maps to two class scores</text>
<text x="40" y="112" font-size="20" fill="#183c35" font-weight="400" text-anchor="start">Global average pooling keeps one mean per channel; a classifier combines the means.</text>
<text x="40" y="160" font-size="21" fill="#183c35" font-weight="700" text-anchor="start">Channel 1</text>
<rect x="40" y="182" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="71" y="223" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">1</text>
<rect x="104" y="182" width="62" height="62" rx="6" fill="#f1e2d1" stroke="none" stroke-width="2"/>
<text x="135" y="223" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">3</text>
<rect x="40" y="246" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="71" y="287" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">2</text>
<rect x="104" y="246" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="135" y="287" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">2</text>
<text x="40" y="346" font-size="20" fill="#183c35" font-weight="400" text-anchor="start">(1+3+2+2)/4</text>
<text x="40" y="378" font-size="26" fill="#12655b" font-weight="700" text-anchor="start">= 2</text>
<text x="225" y="160" font-size="21" fill="#183c35" font-weight="700" text-anchor="start">Channel 2</text>
<rect x="225" y="182" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="256" y="223" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">0</text>
<rect x="289" y="182" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="320" y="223" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">2</text>
<rect x="225" y="246" width="62" height="62" rx="6" fill="#f1e2d1" stroke="none" stroke-width="2"/>
<text x="256" y="287" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">4</text>
<rect x="289" y="246" width="62" height="62" rx="6" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="320" y="287" font-size="29" fill="#183c35" font-weight="700" text-anchor="middle">2</text>
<text x="225" y="346" font-size="20" fill="#183c35" font-weight="400" text-anchor="start">(0+2+4+2)/4</text>
<text x="225" y="378" font-size="26" fill="#12655b" font-weight="700" text-anchor="start">= 2</text>
<path d="M366,246 L427,246" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="383" y="216" font-size="18" fill="#12655b" font-weight="700" text-anchor="start">GAP</text>
<rect x="440" y="201" width="136" height="106" rx="14" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="508" y="239" font-size="20" fill="#183c35" font-weight="700" text-anchor="middle">Features</text>
<text x="508" y="278" font-size="29" fill="#12655b" font-weight="700" text-anchor="middle">[2, 2]</text>
<path d="M587,246 L624,246" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="638" y="173" width="230" height="160" rx="14" fill="#f1e2d1" stroke="none" stroke-width="2"/>
<text x="753" y="207" font-size="22" fill="#183c35" font-weight="700" text-anchor="middle">Linear classifier</text>
<text x="649" y="246" font-size="18" fill="#183c35" font-weight="400" text-anchor="start">W: [1, −0.5]; [−0.5, 1]</text>
<text x="658" y="285" font-size="21" fill="#183c35" font-weight="400" text-anchor="start">b = [1, 1]</text>
<path d="M879,246 L923,246" fill="none" stroke="#12655b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="996" y="183" font-size="20" fill="#183c35" font-weight="700" text-anchor="middle">2 outputs</text>
<rect x="940" y="201" width="115" height="106" rx="14" fill="#e1eae3" stroke="none" stroke-width="2"/>
<text x="997" y="242" font-size="20" fill="#183c35" font-weight="400" text-anchor="middle">logits</text>
<text x="997" y="279" font-size="28" fill="#12655b" font-weight="700" text-anchor="middle">[2, 2]</text>
<rect x="440" y="362" width="615" height="91" rx="14" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="460" y="396" font-size="22" fill="#183c35" font-weight="400" text-anchor="start">s₁ = 1×2 − 0.5×2 + 1 = 2</text>
<text x="460" y="429" font-size="22" fill="#183c35" font-weight="400" text-anchor="start">s₂ = −0.5×2 + 1×2 + 1 = 2</text>
<path d="M40,492 L1060,492" fill="none" stroke="#e1eae3" stroke-width="3"/>
<text x="40" y="527" font-size="18" fill="#183c35" font-weight="400" text-anchor="start">Exact schematic arithmetic. s = Wz + b gives logits; softmax converts logits to probabilities.</text>
</g></svg>
